[package]
name = "playpen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Run any command with its network egress limited to the literal addresses you approved"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
unnecessary_wraps = "allow"

[dependencies]
# The pass loader and its checks; the library only (no clap of its own).
hallpass = { path = "../hallpass", default-features = false }
clap = { version = "4.6.8", features = ["derive"] }
libc = "0.2.191"
nix = { version = "0.32.0", features = ["sched", "mount", "signal", "process", "user", "socket", "fs", "poll", "mman", "uio", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
