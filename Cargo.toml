[package]
name = "playpen"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Run any command with its network egress limited to the literal addresses you approved"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
unnecessary_wraps = "allow"

[dependencies]
# The pass loader and its checks; the library only (no clap of its own).
hallpass = { git = "https://github.com/bobisme/hallpass", rev = "7c06ea837ab6aa98858dc18e4be1fbaf6f3e85ff", default-features = false }
clap = { version = "4.6.8", features = ["derive"] }
libc = "0.2.191"
nix = { version = "0.32.0", features = ["sched", "mount", "signal", "process", "user", "socket", "fs", "poll", "mman", "uio", "net", "term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The digest of a packet capture, read in pieces; already in the tree for hallpass.
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
